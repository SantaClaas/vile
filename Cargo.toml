[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The same version as rust-toolchain.toml; tsrs needs at least this one.
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SantaClaas/vile"
publish = false

[workspace.dependencies]
# Pinned exactly, as every dependency here. .cargo/config.toml makes Cargo pick only versions that
# are a week old or more, as pnpm-workspace.yaml does for npm, and Dependabot proposes updates
# with the same wait (see The workspace in docs/guidelines/rust.md).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# Oxc breaks its API in minor releases, so all its crates move together, to one exact version.
oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_ast_visit = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_span = "=0.158.0"
oxc_syntax = "=0.158.0"

# Strict on purpose, after Oxc and tsrs (see Checks in docs/guidelines/rust.md). An exception is
# #[expect(clippy::lint, reason = "...")] on the smallest item it covers; #[allow] isn't allowed.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

# A dependency nothing uses fails the build, as unused code does (new in Cargo 1.100, where it's a
# warning by default). It only fires when every target that may use the dependency is built, so CI
# runs clippy with --all-targets.
[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Exceptions say why, and can't outlive their cause.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A value that can't be missing is shown to be present, or expect() says why.
unwrap_used = "deny"
# A hash map's order must never reach output, an ID or a report.
iter_over_hash_type = "deny"
# Leftovers don't land.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
# The crates aren't published yet, so they have no crates.io metadata to check. Turned back on
# with the first release.
cargo_common_metadata = "allow"
